<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9f1ff" />
    <title>DECEMBER TOWN</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="사용자 정보">
        <a class="brand" href="#home" aria-label="December Town 홈">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-name">DECEMBER <b>TOWN</b></span>
        </a>
        <div class="user-tools">
          <div class="profile"><span class="avatar">❄</span><span class="nickname">Snowy</span></div>
          <div class="currency" aria-label="보유 별사탕 120개"><span aria-hidden="true">✦</span><b>120</b></div>
          <button class="icon-button notification" aria-label="알림"><span aria-hidden="true">♧</span><i></i></button>
        </div>
      </header>

      <section class="town-frame" aria-label="December Town 메인 마을">
        <div class="town-stage" id="townStage">
          <img class="town-background" src="./public/assets/december-town.png" alt="눈 내리는 겨울 마을. 우체국, 카페, 선물 가게, 집과 크리스마스 트리가 있는 풍경" draggable="false" />
          <div class="hotspots" aria-label="마을 장소">
            <button class="hotspot post-office" data-place="post-office" aria-label="우체국으로 이동"></button>
            <button class="hotspot winter-cafe" data-place="winter-cafe" aria-label="윈터 카페로 이동"></button>
            <button class="hotspot gift-shop" data-place="gift-shop" aria-label="선물 가게로 이동"></button>
            <button class="hotspot my-house" data-place="my-house" aria-label="내 집으로 이동"></button>
            <button class="hotspot town-square" data-place="town-square" aria-label="크리스마스 트리 꾸미기"></button>
          </div>
          <div class="character-layer" id="characterLayer" aria-hidden="true">
            <div class="pixel-person" id="pixelPerson">
              <span class="pixel-hat"></span><span class="pixel-face"></span><span class="pixel-coat"></span>
              <span class="pixel-scarf"></span><span class="pixel-arm"></span><span class="pixel-legs"></span>
            </div>
          </div>
          <div class="location-hint" id="locationHint" aria-live="polite">마을을 둘러보세요 <span>✦</span></div>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="주 메뉴">
        <button class="nav-item active" data-menu="my-town"><span class="nav-icon">⌂</span><span>MY TOWN</span></button>
        <button class="nav-item" data-menu="friends"><span class="nav-icon">♧</span><span>FRIENDS</span></button>
        <button class="nav-item" data-menu="mail"><span class="nav-icon">✉</span><span>MAIL</span><span class="mail-dot"></span></button>
        <button class="nav-item" data-menu="memories"><span class="nav-icon">▣</span><span>MEMORIES</span></button>
      </nav>
    </main>

    <dialog class="place-dialog" id="placeDialog">
      <button class="dialog-close" id="dialogClose" aria-label="닫기">×</button>
      <span class="dialog-snowflake">✦</span>
      <p class="dialog-eyebrow">A LITTLE WINTER MAGIC</p>
      <h1 id="dialogTitle">Coming soon</h1>
      <p class="dialog-copy">이 공간은 준비 중이에요.<br />조금만 기다려 주세요!</p>
      <button class="dialog-ok" id="dialogOk">마을로 돌아가기</button>
    </dialog>
    <script src="./src/main.js"></script>
  </body>
</html>
