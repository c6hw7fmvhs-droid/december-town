<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9f1ff" />
    <title>DECEMBER TOWN</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="사용자 정보">
        <a class="brand" href="#home" aria-label="December Town 홈">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-name">DECEMBER <b>TOWN</b></span>
        </a>
        <div class="user-tools">
          <button class="profile" id="characterStudioOpen" aria-label="CHARACTER STUDIO 열기">
            <span class="avatar" id="profileAvatar" aria-hidden="true"></span>
            <span class="nickname">Snowy</span><span class="profile-edit" aria-hidden="true">✎</span>
          </button>
          <div class="currency" aria-label="보유 별사탕 120개"><span aria-hidden="true">✦</span><b>120</b></div>
          <button class="icon-button notification" aria-label="알림"><span aria-hidden="true">♧</span><i></i></button>
        </div>
      </header>

      <section class="town-frame" aria-label="December Town 메인 마을">
        <div class="town-stage" id="townStage">
          <img class="town-background" src="./public/assets/december-town.png" alt="눈 내리는 겨울 마을. 우체국, 카페, 선물 가게, 집과 크리스마스 트리가 있는 풍경" draggable="false" />
          <div class="hotspots" aria-label="마을 장소">
            <button class="hotspot post-office" data-place="post-office" aria-label="우체국으로 이동"></button>
            <button class="hotspot winter-cafe" data-place="winter-cafe" aria-label="윈터 카페로 이동"></button>
            <button class="hotspot gift-shop" data-place="gift-shop" aria-label="선물 가게로 이동"></button>
            <button class="hotspot my-house" data-place="my-house" aria-label="내 집으로 이동"></button>
            <button class="hotspot town-square" data-place="town-square" aria-label="크리스마스 트리 꾸미기"></button>
          </div>
          <div class="character-layer" id="characterLayer" aria-hidden="true">
            <div class="pixel-person" id="pixelPerson" data-state="IDLE" data-direction="right" aria-label="마을을 걷는 캐릭터"></div>
          </div>
          <div class="location-hint" id="locationHint" aria-live="polite">마을을 둘러보세요 <span>✦</span></div>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="주 메뉴">
        <button class="nav-item active" data-menu="my-town"><span class="nav-icon">⌂</span><span>MY TOWN</span></button>
        <button class="nav-item" data-menu="friends"><span class="nav-icon">♧</span><span>FRIENDS</span></button>
        <button class="nav-item" data-menu="mail"><span class="nav-icon">✉</span><span>MAIL</span><span class="mail-dot"></span></button>
        <button class="nav-item" data-menu="memories"><span class="nav-icon">▣</span><span>MEMORIES</span></button>
      </nav>
    </main>

    <dialog class="place-dialog" id="placeDialog">
      <button class="dialog-close" id="dialogClose" aria-label="닫기">×</button>
      <span class="dialog-snowflake">✦</span>
      <p class="dialog-eyebrow">A LITTLE WINTER MAGIC</p>
      <h1 id="dialogTitle">Coming soon</h1>
      <p class="dialog-copy">이 공간은 준비 중이에요.<br />조금만 기다려 주세요!</p>
      <button class="dialog-ok" id="dialogOk">마을로 돌아가기</button>
    </dialog>
    <dialog class="studio-dialog" id="characterStudio" aria-labelledby="studioTitle">
      <div class="studio-shell">
        <aside class="studio-preview-panel">
          <div class="studio-brand"><span>✦</span> DECEMBER TOWN</div>
          <button class="studio-close" id="studioClose" aria-label="캐릭터 스튜디오 닫기">×</button>
          <p class="studio-kicker">YOUR LITTLE WINTER SELF</p>
          <h1 id="studioTitle">CHARACTER<br />STUDIO</h1>
          <div class="studio-preview-scene">
            <span class="preview-snow snow-one">✦</span><span class="preview-snow snow-two">✧</span>
            <div class="studio-character" id="studioCharacterPreview" aria-label="캐릭터 미리보기"></div>
            <span class="preview-snow snow-three">✦</span>
          </div>
          <div class="preview-name">SNOWY <span>✦</span></div>
          <p class="preview-caption">A tiny friend for a snowy day</p>
        </aside>
        <section class="studio-controls" aria-label="캐릭터 외형 선택">
          <div class="studio-controls-head">
            <div><p class="studio-kicker">MAKE IT YOURS</p><h2>나만의 미니미 만들기</h2></div>
            <span class="studio-sparkle" aria-hidden="true">✧</span>
          </div>
          <div class="customizer-groups" id="customizerGroups"></div>
          <div class="studio-actions">
            <button class="studio-action random-action" id="randomCharacter"><span>✧</span> 랜덤 생성</button>
            <button class="studio-action reset-action" id="resetCharacter">초기화</button>
            <button class="studio-action save-action" id="saveCharacter">저장하기 <span>♡</span></button>
          </div>
          <p class="studio-save-note" id="studioSaveNote" aria-live="polite">저장하면 마을과 프로필에 적용돼요.</p>
        </section>
      </div>
    </dialog>
    <script src="./src/data/character-items.js"></script>
    <script src="./src/data/character-art.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
